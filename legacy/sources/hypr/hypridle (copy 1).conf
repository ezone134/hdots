# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}


# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 60
    on-timeout = brightnessctl -sd $keyboard_id; brightnessctl -d $keyboard_id set 0
    on-resume = brightnessctl -rd $keyboard_id;
    # on-timeout = brightnessctl -sd platform::kbd_backlight set 0; notify-send "hypridle" "Turning off the Keyboard" &
    # on-resume = brightnessctl -rd platform::kbd_backlight; notify-send "hypridle" "Keyboard Brightness restored" &
}


# brightness low
listener {
   # timeout = 150                                # 2.5min.
    timeout = 60
    on-timeout = brightnessctl -s set 10; notify-send "hypridle" "Dimming the Screen" &          # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r; kill_launcher; notify-send "hypridle" "Brightness restored" &               # monitor backlight restore.
}

# screen off
listener {
  #  timeout = 330                                 # 5.5min.
    timeout = 70

    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed.
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

#lock after screen off
listener {
  #  timeout = 300                                 # 5min.
        timeout = 100
    on-timeout = loginctl lock-session            # lock screen when timeout has passed.
}


# sleep the device
listener {
    timeout = 1800                                # 30min.
#    on-timeout = systemctl suspend                # suspend pc.
    on-timeout = custom-sleep               # suspend pc.
}
