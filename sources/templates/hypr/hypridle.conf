general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = custom-sleep              # your custom sleep script
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Keyboard Backlight Off
listener {
    timeout = 60
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# 2. Screen Brightness Low
# brightness_main save|restore keeps ONE writer for the backlight: brightnessctl
# -r resurrects its own saved level, not the one brightness_main last set, so a
# keypress while dimmed jumps the panel when idle ends. Dim level and timeout:
listener {
    timeout = 180
    on-timeout = brightness_main save && brightness_main set 10
    on-resume = brightness_main restore
}

# 3. Screen Off (DPMS)
listener {
    timeout = 70
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightness_main restore && kill_launcher
}

# 4. Lock Session
listener {
    timeout = 100
    on-timeout = loginctl lock-session
    on-resume = kill_launcher
}

# 5. Suspend/Sleep Device
listener {
    timeout = 1800                               # 30 minutes
    on-timeout = custom-sleep
}
