# Main configuration options
[main]
font=$rofi_font:size=$rofi_font_size
dpi-aware=auto
prompt=> 
icons-enabled=yes
lines=10
width=30
horizontal-pad=20
vertical-pad=20
inner-pad=10

# Color scheme — expanded from $states2 by pull_colors_val
[colors]
background=$bg8
text=$fg8
match=$acc8
selection=$acc_ec8
selection-text=$fg8
selection-match=$acc8
input=$fg8
prompt=$acc8
placeholder=${fg_1}66
counter=${fg_1}88
border=$border8

[border]
width=2
radius=10