[package]
name = "gcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gcp"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
nix = { version = "0.29", features = ["mman", "fs"] }
serde_json = "1"

[profile.release]
# Shipped binary, so size matters: `strip` alone was worth ~50% (the release
# default keeps a full symbol table), fat LTO folds the generic instantiations
# across crates. No catch_unwind anywhere in gcp, so aborting on panic is safe
# and drops the landing pads.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
