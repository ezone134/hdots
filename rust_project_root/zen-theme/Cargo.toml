[package]
name = "zen-theme"
version = "0.1.0"
edition = "2021"
description = "Shared zen theme layer: session state paths, shell_vars.json palette, theme cards."
license = "MIT"

[lib]
name = "zen_theme"
path = "src/lib.rs"

[dependencies]
zen-color = { path = "../zen-color" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
