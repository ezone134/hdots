[package]
name = "zmods-clock"
version = "0.1.0"
edition = "2021"
description = "Example zen-shell data-provider module: publishes the wall clock"
license = "MIT"

[lib]
# `name` is what cargo calls the artifact: the shell gets `libclock.so`, which
# gets deployed as `$sources/lib/clock.so` (cargo's `lib` prefix is dropped —
# the loader only looks at `*.so`).
name = "clock"
crate-type = ["cdylib"]
path = "src/lib.rs"

# No dependencies on purpose: the whole ABI is four C functions, so a module
# stays a few kB and cannot drag a second copy of anything into the bar's
# address space. Time formatting is done by hand below rather than by pulling
# in chrono.
[dependencies]

[dev-dependencies]
# Only for the tests (the ABI version constant and the civil-date check) —
# dev-dependencies are not linked into the cdylib, so the shipped .so stays
# dependency-free.
zmod = { path = "../../zmod" }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
# panic = "unwind" is left at the default deliberately, and every ABI function
# below wraps its body in catch_unwind. An unwind out of an `extern "C"` fn
# aborts the whole process since Rust 1.71, and the host cannot catch it for
# us — so a module has to contain its own failures.
