[package]
name = "zen-image"
version = "0.1.0"
edition = "2021"
description = "Bare-metal Wayland + Vulkan GPU image viewer"

[[bin]]
name = "zen-image"
path = "src/main.rs"

[dependencies]
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
ash = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
naga = { version = "29", default-features = false, features = ["wgsl-in", "spv-out"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true