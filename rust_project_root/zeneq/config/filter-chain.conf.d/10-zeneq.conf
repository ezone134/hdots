# zeneq — 10-band parametric equalizer for PipeWire
#
# Drop this file (or a copy) into ~/.config/pipewire/pipewire.conf.d/
# and restart PipeWire:
#
#     cp config/filter-chain.conf.d/10-zeneq.conf ~/.config/pipewire/pipewire.conf.d/
#     systemctl --user restart pipewire pipewire-pulse
#
# PipeWire finds the plugin by NAME in its LADSPA search path, so the plugin
# must be reachable. Either:
#   * install libzeneq.so as zeneq.so into a system ladspa dir, or
#   * point the daemon at it, e.g. through a systemd override:
#       systemctl --user edit pipewire   →   [Service] Environment=LADSPA_PATH=/path/to/target/release

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "zeneq 10-band EQ"
          media.name = "zeneq 10-band EQ"
          filter.graph = {
              nodes = [
                  {
                      type = ladspa
                      name = zeneq
                      plugin = "zeneq"
                      label = zeneq
                      control = {
                          "31 Hz" = 0.0
                          "62 Hz" = 0.0
                          "125 Hz" = 0.0
                          "250 Hz" = 0.0
                          "500 Hz" = 0.0
                          "1 kHz" = 0.0
                          "2 kHz" = 0.0
                          "4 kHz" = 0.0
                          "8 kHz" = 0.0
                          "16 kHz" = 0.0
                          Master = 0.0
                      }
                  }
              ]
              links = [
              ]
          }
          capture.props = {
              node.name = "zeneq_input"
              media.class = Audio/Sink
          }
          playback.props = {
              node.name = "zeneq_output"
              node.passive = true
          }
      }
    }
]