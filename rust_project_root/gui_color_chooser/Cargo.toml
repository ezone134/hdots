[package]
name = "gui_color_chooser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gui_color_chooser"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
nix = { version = "0.29", features = ["mman", "fs"] }
serde_json = "1"
